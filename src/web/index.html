<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FingerGuard Browser</title>
<style>
/* ========== CSS Reset & Variables ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#0f1117;--bg-surface:#181a23;--bg-surface-hi:#1e2130;--bg-elevated:#252836;
  --border:#2a2d3e;--border-hi:#363a4f;
  --text-primary:#e4e6ed;--text-secondary:#9298ad;--text-muted:#5c6275;
  --accent:#4263eb;--accent-hi:#3b5bdb;--accent-soft:rgba(66,99,235,.12);
  --success:#2dd4a7;--success-soft:rgba(45,212,167,.12);
  --warning:#f5a623;--warning-soft:rgba(245,166,35,.12);
  --danger:#ef4444;--danger-soft:rgba(239,68,68,.12);
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 4px 24px rgba(0,0,0,.3);--shadow-lg:0 8px 40px rgba(0,0,0,.4);
  --sidebar-w:220px;--transition:.2s cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:14px;background:var(--bg-base);color:var(--text-primary);-webkit-font-smoothing:antialiased}

/* ========== Scrollbar ========== */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#454960}

/* ========== Layout ========== */
#app{display:flex;height:100vh}

/* ========== Sidebar ========== */
.sidebar{width:var(--sidebar-w);background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width var(--transition)}
.sidebar.collapsed{width:56px}
.sidebar-header{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);height:56px}
.sidebar-header .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#748ffc);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sidebar-header .title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden}
.sidebar-header .title span{color:var(--accent)}
.sidebar.collapsed .title{display:none}

.nav{flex:1;padding:8px;overflow-y:auto}
.nav-section{margin-bottom:16px}
.nav-section-label{font-size:11px;text-transform:uppercase;color:var(--text-muted);padding:0 12px 6px;font-weight:600;letter-spacing:.5px}
.sidebar.collapsed .nav-section-label{display:none}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);transition:all var(--transition);font-size:13.5px;position:relative;margin-bottom:2px;white-space:nowrap}
.nav-item:hover{background:var(--bg-surface-hi);color:var(--text-primary)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar.collapsed .nav-item span{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px}

.sidebar-footer{padding:8px;border-top:1px solid var(--border)}
.sidebar-collapse-btn{width:100%;padding:8px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);transition:all var(--transition);border:none;background:transparent}
.sidebar-collapse-btn:hover{background:var(--bg-surface-hi);color:var(--text-primary)}
.sidebar-collapse-btn svg{width:16px;height:16px;transition:transform var(--transition)}
.sidebar.collapsed .sidebar-collapse-btn svg{transform:rotate(180deg)}
.sidebar.collapsed .sidebar-collapse-btn span{display:none}

/* ========== Main Content ========== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;background:var(--bg-surface)}
.topbar-title{font-size:16px;font-weight:600;flex:1}
.topbar-search{position:relative;width:280px}
.topbar-search input{width:100%;padding:7px 12px 7px 34px;background:var(--bg-surface-hi);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;outline:none;transition:all var(--transition)}
.topbar-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.topbar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
.topbar-search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:2px 6px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--text-muted)}
.topbar-actions{display:flex;gap:8px}

.content{flex:1;overflow-y:auto;padding:20px}

/* ========== Buttons ========== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all var(--transition);white-space:nowrap;font-family:var(--font)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hi)}
.btn-ghost{background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--bg-surface-hi);color:var(--text-primary)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-success{background:var(--success-soft);color:var(--success)}
.btn-success:hover{background:rgba(45,212,167,.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px;width:32px;height:32px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ========== Stat Cards ========== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:8px;transition:all var(--transition);cursor:pointer}
.stat-card:hover{border-color:var(--border-hi);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.stat-card .stat-icon svg{width:22px;height:22px}
.stat-card .stat-value{font-size:28px;font-weight:700;line-height:1}
.stat-card .stat-label{font-size:13px;color:var(--text-secondary)}
.stat-card .stat-trend{font-size:12px;display:flex;align-items:center;gap:4px}

/* ========== Table ========== */
.table-container{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.table-toolbar{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.table-toolbar .toolbar-left{display:flex;gap:8px;align-items:center;flex:1}
.table-toolbar .toolbar-right{display:flex;gap:8px;align-items:center}
.filter-select{padding:6px 10px;background:var(--bg-surface-hi);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--accent)}
.filter-input{padding:6px 10px;background:var(--bg-surface-hi);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;outline:none;transition:all var(--transition)}
.filter-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

table{width:100%;border-collapse:collapse}
thead{background:var(--bg-surface-hi)}
th{padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
tbody tr{transition:background var(--transition)}
tbody tr:hover{background:var(--bg-surface-hi)}
tbody tr:last-child td{border-bottom:none}

/* ========== Badges & Status ========== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-info{background:var(--accent-soft);color:var(--accent)}
.badge-muted{background:var(--bg-elevated);color:var(--text-muted)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.running{background:var(--success);box-shadow:0 0 6px var(--success)}
.status-dot.stopped{background:var(--text-muted)}

/* ========== Checkbox ========== */
.checkbox{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ========== Row Actions ========== */
.row-actions{display:flex;gap:4px}
.row-actions .btn-icon{width:28px;height:28px;padding:5px}
.row-actions .btn-icon svg{width:14px;height:14px}

/* ========== Empty State ========== */
.empty-state{padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.5}
.empty-state h3{font-size:15px;margin-bottom:4px;color:var(--text-secondary)}
.empty-state p{font-size:13px}

/* ========== Modal ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity var(--transition)}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:520px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.95);transition:transform var(--transition)}
.modal-overlay.show .modal{transform:scale(1)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between;gap:12px}
.modal-header h2{font-size:16px;font-weight:600;flex:1}
.modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:var(--radius-sm);transition:all var(--transition)}
.modal-close:hover{background:var(--bg-surface-hi);color:var(--text-primary)}
.modal-close svg{width:18px;height:18px}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ========== Form ========== */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-secondary)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;background:var(--bg-surface-hi);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;outline:none;transition:all var(--transition);font-family:var(--font)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-group textarea{resize:vertical;min-height:60px;font-family:var(--mono)}
.form-group .hint{font-size:12px;color:var(--text-muted);margin-top:4px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}

/* Toggle Switch */
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bg-elevated);border-radius:20px;transition:all var(--transition)}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--text-secondary);border-radius:50%;transition:all var(--transition)}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px);background:#fff}

/* ========== Toast ========== */
.toast-container{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);min-width:280px;max-width:400px;animation:slideIn .3s ease;pointer-events:auto}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--accent)}
.toast.warning{border-left:3px solid var(--warning)}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success svg{color:var(--success)}
.toast.error svg{color:var(--danger)}
.toast.info svg{color:var(--accent)}
.toast.warning svg{color:var(--warning)}
.toast .toast-msg{font-size:13px;flex:1}
.toast .toast-close{cursor:pointer;color:var(--text-muted);background:none;border:none}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ========== Panels (API, Settings, etc.) ========== */
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-header h2{font-size:15px;font-weight:600}

.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-row .info-label{color:var(--text-secondary);font-size:13px}
.info-row .info-value{font-size:13px;font-weight:500;font-family:var(--mono)}

.code-block{background:var(--bg-base);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-family:var(--mono);font-size:12px;overflow-x:auto;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap;word-break:break-all}

.endpoint-list{display:flex;flex-direction:column;gap:8px}
.endpoint-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-surface-hi);border-radius:var(--radius-sm);font-size:13px}
.endpoint-item .method{font-weight:700;font-size:11px;padding:2px 6px;border-radius:4px;min-width:50px;text-align:center}
.endpoint-item .method.GET{background:var(--success-soft);color:var(--success)}
.endpoint-item .method.POST{background:var(--warning-soft);color:var(--warning)}
.endpoint-item .method.PUT{background:var(--accent-soft);color:var(--accent)}
.endpoint-item .method.DELETE{background:var(--danger-soft);color:var(--danger)}
.endpoint-item .path{font-family:var(--mono);color:var(--text-secondary)}

/* ========== Quick Launch (Ctrl+K) ========== */
.quick-launch{position:fixed;top:20%;left:50%;transform:translateX(-50%) scale(.95);width:480px;max-width:90vw;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:1500;opacity:0;pointer-events:none;transition:all var(--transition)}
.quick-launch.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.quick-launch input{width:100%;padding:14px 18px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-primary);font-size:15px;outline:none;font-family:var(--font)}
.quick-launch-results{max-height:320px;overflow-y:auto;padding:4px}
.quick-launch-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition)}
.quick-launch-item:hover,.quick-launch-item.selected{background:var(--accent-soft)}
.quick-launch-item .ql-icon{width:32px;height:32px;border-radius:8px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:14px}
.quick-launch-item .ql-info{flex:1}
.quick-launch-item .ql-title{font-size:13px;font-weight:500}
.quick-launch-item .ql-sub{font-size:12px;color:var(--text-muted)}

/* ========== Loading ========== */
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{display:flex;align-items:center;justify-content:center;padding:40px}

/* ========== Tabs ========== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--transition)}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ========== Color dots for groups ========== */
.color-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ========== Responsive ========== */
@media(max-width:768px){
  .sidebar{position:absolute;z-index:100;height:100%}
  .topbar-search{width:auto;flex:1}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">🛡️</div>
      <div class="title">Finger<span>Guard</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-section">
        <div class="nav-section-label" data-i18n="nav.main">Main</div>
        <div class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </div>
        <div class="nav-item" data-view="profiles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span data-i18n="nav.profiles">Profiles</span>
        </div>
        <div class="nav-item" data-view="proxies">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span data-i18n="nav.proxy_pool">Proxy Pool</span>
        </div>
        <div class="nav-item" data-view="groups">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span data-i18n="nav.groups">Groups</span>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-label" data-i18n="nav.system">System</div>
        <div class="nav-item" data-view="api">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span data-i18n="nav.api_mcp">API &amp; MCP</span>
        </div>
        <div class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="nav.settings">Settings</span>
        </div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-collapse-btn" id="collapseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span data-i18n="nav.collapse">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">

// ========== API Client ==========
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'X-API-Key': State.apiKey,
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(`${State.baseUrl}/api${path}`, opts);
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({error: resp.statusText}));
    throw new Error(err.error || `HTTP ${resp.status}`);
  }
  return resp.json();
}

// ========== Toast ==========
function toast(msg, type='info') {
  const container = document.getElementById('toastContainer');
  const icons = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icons[type]||icons.info}<span class="toast-msg">${msg}</span><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
  container.appendChild(el);
  setTimeout(() => el.style.opacity = '0', 4000);
  setTimeout(() => el.remove(), 4500);
}

// ========== Modal ==========
function showModal(title, bodyHtml, footerHtml='') {
  const overlay = document.getElementById('modalOverlay');
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${title}</h2>
        <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
    </div>`;
  overlay.classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ========== Navigation ==========
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    State.currentView = item.dataset.view;
    renderView();
  });
});

document.getElementById('collapseBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

// ========== View Rendering ==========
function renderView() {
  const content = document.getElementById('content');
  const titles = {dashboard:'Dashboard',profiles:'Profiles',proxies:'Proxy Pool',groups:'Groups',api:'API & MCP',settings:'Settings'};
  const titleKeys = {dashboard:'nav.dashboard',profiles:'nav.profiles',proxies:'nav.proxy_pool',groups:'nav.groups',api:'nav.api_mcp',settings:'nav.settings'};
  document.getElementById('pageTitle').textContent = _(titleKeys[State.currentView]);

  switch(State.currentView) {
    case 'dashboard': renderDashboard(); break;
    case 'profiles': renderProfiles(); break;
    case 'proxies': renderProxies(); break;
    case 'groups': renderGroups(); break;
    case 'api': renderAPI(); break;
    case 'settings': renderSettings(); break;
  }
}

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="btn btn-icon btn-ghost" title="${_('profiles.edit')}" onclick="showProfileModal('${p.name}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn btn-icon btn-ghost" title="${_('profiles.delete')}" onclick="deleteProfile('${p.name}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </td>
    </tr>`;
}

function maskProxy(proxy) {
  return proxy.replace(/(:)[^@]+@/, '$1***@');
}

function filterProfiles() {
  const search = document.getElementById('profileSearch')?.value.toLowerCase() || '';
  const status = document.getElementById('profileStatusFilter')?.value || '';
  const group = document.getElementById('profileGroupFilter')?.value || '';
  document.querySelectorAll('#profileTableBody tr').forEach(row => {
    const name = row.dataset.name.toLowerCase();
    const p = State.profiles.find(x => x.name === row.dataset.name);
    if (!p) return;
    const matchSearch = !search || name.includes(search);
    const matchStatus = !status || (status === 'running' && p.is_running) || (status === 'stopped' && !p.is_running);
    const matchGroup = !group || String(p.group_id) === group;
    row.style.display = (matchSearch && matchStatus && matchGroup) ? '' : 'none';
  });
}

function toggleSelectAll(cb) {
  document.querySelectorAll('.profile-checkbox').forEach(c => { c.checked = cb.checked; toggleSelectProfile(c.value, cb.checked); });
}
function toggleSelectProfile(name, checked) {
  if (checked) State.selectedProfiles.add(name); else State.selectedProfiles.delete(name);
}

async function launchProfile(name) {
  try {
    toast(_('profiles.launch') + ': ' + name, 'info');
    await api('POST', `/profiles/${encodeURIComponent(name)}/launch`);
    toast(name + ' launched', 'success');
    renderProfiles();
  } catch(e) { toast(e.message, 'error'); }
}

async function stopProfile(name) {
  try {
    await api('POST', `/profiles/${encodeURIComponent(name)}/stop`);
    toast(name + ' stopped', 'success');
    renderProfiles();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteProfile(name) {
  showModal(_('profiles.delete_confirm'), `<p>${name}</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${_('common.cancel')}</button>
     <button class="btn btn-danger" onclick="confirmDeleteProfile('${name}')">${_('profiles.delete')}</button>`);
}
async function confirmDeleteProfile(name) {
  try {
    await api('DELETE', `/profiles/${encodeURIComponent(name)}`);
    toast(_('common.deleted'), 'success');
    closeModal();
    renderProfiles();
  } catch(e) { toast(e.message, 'error'); }
}

async function launchAllProfiles() {
  const stopped = State.profiles.filter(p => !p.is_running);
  if (stopped.length === 0) { toast('All profiles already running', 'info'); return; }
  toast(`Launching ${stopped.length} profiles...`, 'info');
  for (const p of stopped) {
    try { await api('POST', `/profiles/${encodeURIComponent(p.name)}/launch`); } catch(e) {}
  }
  toast(`Launched ${stopped.length} profiles`, 'success');
  renderProfiles();
}

async function stopAllProfiles() {
  const running = State.profiles.filter(p => p.is_running);
  if (running.length === 0) { toast(_('profiles.no_running'), 'info'); return; }
  toast(_('profiles.stopping_all') + ` ${running.length}...`, 'info');
  try {
    await api('POST', '/profiles/stop-all');
    toast(`${running.length} ${_('profiles.stopped')}`, 'success');
  } catch(e) {
    // Fallback: stop one by one
    for (const p of running) {
      try { await api('POST', `/profiles/${encodeURIComponent(p.name)}/stop`); } catch(e) {}
    }
    toast(`${running.length} ${_('profiles.stopped')}`, 'success');
  }
  renderProfiles();
}

async function cloneProfile(name) {
  const newName = prompt(`${_('profiles.clone_name')}:`, `${name}_copy`);
  if (!newName) return;
  try {
    await api('POST', `/profiles/${encodeURIComponent(name)}/clone`, {new_name: newName});
    toast(_('profiles.cloned'), 'success');
    renderProfiles();
  } catch(e) { toast(e.message, 'error'); }
}

async function screenshotProfile(name) {
  try {
    toast(_('profiles.taking_screenshot'), 'info');
    const resp = await api('POST', `/profiles/${encodeURIComponent(name)}/screenshot`);
    toast(_('profiles.screenshot_saved'), 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function batchLaunchProfiles() {
  const names = Array.from(State.selectedProfiles);
  if (names.length === 0) return;
  toast(`${_('profiles.batch_launching')} ${names.length}...`, 'info');
  try {
    const resp = await api('POST', '/profiles/batch-launch', {names, max_workers: 5});
    toast(`${resp.launched.length} ${_('profiles.launched')}, ${resp.failed.length} ${_('common.error')}`, 'success');
    State.selectedProfiles.clear();
    renderProfiles();
  } catch(e) { toast(e.message, 'error'); }
}

function showProfileContextMenu(event, name) {
  event.preventDefault();
  const menu = document.createElement('div');
  menu.style.cssText = `position:fixed;left:${event.clientX}px;top:${event.clientY}px;background:var(--bg-elevated);border:1px solid var(--border-hi);border-radius:var(--radius-sm);padding:4px;z-index:9999;min-width:160px;box-shadow:var(--shadow-lg)`;
  const p = State.profiles.find(x => x.name === name);
  const items = [
    p && p.is_running ? {label: _('profiles.stop'), icon: '⏹', action: () => stopProfile(name)}
                       : {label: _('profiles.launch'), icon: '▶', action: () => launchProfile(name)},
    {label: _('profiles.edit'), icon: '✎', action: () => showProfileModal(name)},
    {label: _('profiles.clone'), icon: '⧉', action: () => cloneProfile(name)},
    p && p.is_running ? {label: _('profiles.screenshot'), icon: '📷', action: () => screenshotProfile(name)} : null,
    {label: _('profiles.delete'), icon: '🗑', action: () => deleteProfile(name), danger: true},
  ].filter(Boolean);
  items.forEach(item => {
    const btn = document.createElement('div');
    btn.style.cssText = `padding:8px 12px;cursor:pointer;border-radius:4px;font-size:13px;display:flex;gap:8px;align-items:center;${item.danger?'color:var(--danger)':''}`;
    btn.onmouseenter = () => btn.style.background = 'var(--bg-surface-hi)';
    btn.onmouseleave = () => btn.style.background = 'transparent';
    btn.textContent = `${item.icon} ${item.label}`;
    btn.onclick = () => { menu.remove(); item.action(); };
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  const closeMenu = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); } };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);
}

async function applyBatchEdit(names) {
  const updates = {};
  if (document.getElementById('batchEditProxy').checked) updates.proxy = document.getElementById('batchProxyValue').value;
  if (document.getElementById('batchEditTimezone').checked) updates.timezone = document.getElementById('batchTimezoneValue').value;
  if (document.getElementById('batchEditWebrtc').checked) updates.webrtc = document.getElementById('batchWebrtcValue').value;
  if (document.getElementById('batchEditHeadless').checked) updates.headless = document.getElementById('batchHeadlessValue').checked;
  for (const name of names) {
    try { await api('PUT', `/profiles/${encodeURIComponent(name)}`, updates); } catch(e) {}
  }
  toast(`${names.length} ${_('profiles.batch_updated')}`, 'success');
  closeModal();
  renderProfiles();
}

async function exportProfiles() {
  try {
    const resp = await api('POST', '/profiles/export');
    const blob = new Blob([JSON.stringify(resp, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fingerguard_export_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast(_('profiles.exported'), 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function importProfiles(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const resp = await api('POST', '/profiles/import', {profiles: data.profiles || data});
    toast(`${resp.imported} ${_('profiles.imported')}, ${resp.failed} ${_('common.error')}`, 'success');
    renderProfiles();
  } catch(e) { toast(e.message, 'error'); }
  input.value = '';
}

async function loadCookies(name) {
  if (!name) { toast(_('profiles.cookies_hint'), 'info'); return; }
  try {
    const resp = await api('GET', `/profiles/${encodeURIComponent(name)}/cookies`);
    const cookies = resp.cookies || [];
    if (cookies.length > 0) {
      document.getElementById('pf_cookies').value = JSON.stringify(cookies, null, 2);
      toast(`${cookies.length} cookies loaded`, 'success');
    } else {
      toast('No cookies found', 'info');
    }
  } catch(e) { toast(e.message, 'error'); }
}

      </div>
      <div class="form-group">

async function aiGenerate() {
  const desc = document.getElementById('pf_ai_desc').value;
  if (!desc) { toast('Please enter a description', 'warning'); return; }
  try {
    toast('AI generating fingerprint...', 'info');
    const result = await api('POST', '/fingerprint/generate', {description: desc});
    toast('Fingerprint generated', 'success');
    // Auto-fill name if empty
    if (!document.getElementById('pf_name').value) {
      document.getElementById('pf_name').value = 'AI_' + Date.now().toString(36);
    }
  } catch(e) { toast(e.message, 'error'); }
}

async function saveProfile(name) {
  // Determine proxy value based on mode
  const proxyMode = document.querySelector('input[name="pf_proxy_mode"]:checked')?.value || 'none';
  let proxyValue = null;
  if (proxyMode === 'pool') {
    proxyValue = document.getElementById('pf_proxy_pool')?.value || null;
  } else if (proxyMode === 'custom') {
    proxyValue = document.getElementById('pf_proxy')?.value || null;
  }

  const data = {
    name: document.getElementById('pf_name').value,
    browser_engine: document.getElementById('pf_browser_engine').value,
    os_type: document.getElementById('pf_os_type').value,
    proxy: proxyValue,
    timezone: document.getElementById('pf_timezone').value || null,
    group_id: document.getElementById('pf_group').value || null,
    tags: document.getElementById('pf_tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    canvas_fp: document.getElementById('pf_canvas').checked,
    webgl_fp: document.getElementById('pf_webgl').checked,
    audio_fp: document.getElementById('pf_audio').checked,
    webrtc: document.getElementById('pf_webrtc').value,
    dns_protection: document.getElementById('pf_dns').value,
    notes: document.getElementById('pf_notes').value || null,
    headless: document.getElementById('pf_headless').checked,
    humanize: document.getElementById('pf_humanize').checked,
    user_agent: document.getElementById('pf_user_agent').value || null,
  };
  // Save cookies if provided
  const cookiesText = document.getElementById('pf_cookies')?.value.trim();
  if (cookiesText && name) {
    try {
      const cookies = JSON.parse(cookiesText);
      data._cookies = cookies;
    } catch(e) {}
  }
  try {
    if (name) {
      await api('PUT', `/profiles/${encodeURIComponent(name)}`, data);
      // Save cookies separately
      if (cookiesText) {
        try {
          const cookies = JSON.parse(cookiesText);
          await api('POST', `/profiles/${encodeURIComponent(name)}/cookies`, {cookies});
        } catch(e) {}
      }
    } else {
      await api('POST', '/profiles', data);
    }
    toast(_('common.saved'), 'success');
    closeModal();
    renderProfiles();
  } catch(e) { toast(e.message, 'error'); }
}

            <h3>${_('groups.empty')}</h3>
          </div>
        ` : `
          <table>
            <thead>
              <tr>
                <th>${_('groups.name')}</th>
                <th>Description</th>
                <th>${_('profiles_count')}</th>
                <th>${_('groups.actions')}</th>
              </tr>
            </thead>
            <tbody>
              ${State.groups.map(g => {
                const count = State.profiles.filter(p => p.group_id == g.id).length;
                return `
                <tr>
                  <td style="font-weight:500"><span class="color-dot" style="background:${g.color||'#4263eb'};margin-right:8px"></span>${g.name}</td>
                  <td style="color:var(--text-secondary)">${g.description||'—'}</td>
                  <td><span class="badge badge-muted">${count}</span></td>
                  <td>
                    <div class="row-actions">
                      <button class="btn btn-icon btn-success" title="${_('groups.bulk_launch')}" onclick="bulkLaunchGroup('${g.name}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                      </button>
                      <button class="btn btn-icon btn-danger" title="${_('groups.bulk_stop')}" onclick="bulkStopGroup('${g.name}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
                      </button>
                      <button class="btn btn-icon btn-ghost" title="${_('profiles.delete')}" onclick="deleteGroup('${g.name}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        `}
      </div>
    `;
  } catch(e) {
    content.innerHTML = `<div class="empty-state"><h3>${_('common.error')}</h3><p>${e.message}</p></div>`;
  }
}

function showCreateGroupModal() {
  const colors = ['#4263eb','#2dd4a7','#f5a623','#ef4444','#a855f7','#06b6d4','#ec4899'];
  showModal(_('groups.create_title'), `
    <div class="form-group">
      <label>${_('groups.name_label')}</label>
      <input type="text" id="gp_name" placeholder="Shopping">
    </div>
    <div class="form-group">
      <label>${_('groups.color_label')}</label>
      <div style="display:flex;gap:8px">
        ${colors.map(c => `<label style="cursor:pointer"><input type="radio" name="gp_color" value="${c}" ${c==='#4263eb'?'checked':''} style="display:none"><span class="color-dot" style="width:24px;height:24px;background:${c};border:2px solid transparent;border-radius:50%;display:inline-block" onclick="this.parentElement.parentElement.querySelectorAll('span').forEach(s=>s.style.borderColor='transparent');this.style.borderColor='var(--text-primary)'"></span></label>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label>${_('groups.desc_label')}</label>
      <input type="text" id="gp_desc" placeholder="E-commerce profiles">
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">${_('common.cancel')}</button>
    <button class="btn btn-primary" onclick="createGroup()">${_('settings.title'==='设置'?'创建':'Create')}</button>
  `);
}

async function createGroup() {
  const name = document.getElementById('gp_name').value;
  const desc = document.getElementById('gp_desc').value;
  const color = document.querySelector('input[name="gp_color"]:checked')?.value || '#4263eb';
  if (!name) { toast('Name is required', 'warning'); return; }
  try {
    await api('POST', '/groups', {name, description: desc, color});
    toast(_('common.saved'), 'success');
    closeModal();
    renderGroups();
  } catch(e) { toast(e.message, 'error'); }
}

async function bulkLaunchGroup(name) {
  toast('Launching group: ' + name, 'info');
  try {
    await api('POST', `/groups/${encodeURIComponent(name)}/launch`);
    toast('Group launched', 'success');
    renderGroups();
  } catch(e) { toast(e.message, 'error'); }
}

async function bulkStopGroup(name) {
  toast('Stopping group: ' + name, 'info');
  try {
    await api('POST', `/groups/${encodeURIComponent(name)}/stop`);
    toast('Group stopped', 'success');
    renderGroups();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteGroup(name) {
  showModal(_('groups.delete_confirm'), `<p>${name}</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${_('common.cancel')}</button>
     <button class="btn btn-danger" onclick="confirmDeleteGroup('${name}')">${_('profiles.delete')}</button>`);
}
async function confirmDeleteGroup(name) {
  try {
    await api('DELETE', `/groups/${encodeURIComponent(name)}`);
    toast(_('common.deleted'), 'success');
    closeModal();
    renderGroups();
  } catch(e) { toast(e.message, 'error'); }
}

// ========== API & MCP ==========

let apiServerPort = null;

  content.innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <h2>${_('api.status')}</h2>
        <span class="badge ${apiServerRunning?'badge-success':'badge-muted'}">
          <span class="status-dot ${apiServerRunning?'running':'stopped'}"></span>
          ${apiServerRunning?_('api.running'):_('api.stopped')}
        </span>
      </div>
      <div class="info-row">
        <span class="info-label">${_('api.base_url')}</span>
        <span class="info-value">${apiServerRunning ? 'http://127.0.0.1:' + apiServerPort : '—'}</span>
      </div>
      <div class="info-row">
        <span class="info-label">${_('api.api_key')}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="info-value" id="apiKeyDisplay">${State.apiKey ? State.apiKey.slice(0,8) + '••••••••' : '—'}</span>
          ${State.apiKey ? `<button class="btn btn-ghost btn-sm" onclick="copyText('${State.apiKey}')">${_('api.copy')}</button>` : ''}
        </span>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        ${apiServerRunning ? `
          <button class="btn btn-danger" onclick="stopApiServer()">${_('api.stop')}</button>
        ` : `
          <button class="btn btn-primary" onclick="startApiServer()">${_('api.start')}</button>
        `}
        <button class="btn btn-ghost" onclick="resetApiKey()">${_('api.reset_key')}</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>${_('api.mcp_title')}</h2></div>
      <p style="color:var(--text-secondary);font-size:13px;margin-bottom:12px">${_('api.mcp_desc')}</p>
      <div class="code-block" id="mcpConfig">Loading...</div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="copyMcpConfig()">${_('api.copy_mcp')}</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>${_('api.endpoints')}</h2></div>
      <div class="endpoint-list">
        <div class="endpoint-item"><span class="method GET">GET</span><span class="path">/api/health</span></div>
        <div class="endpoint-item"><span class="method GET">GET</span><span class="path">/api/profiles</span></div>
        <div class="endpoint-item"><span class="method POST">POST</span><span class="path">/api/profiles</span></div>
        <div class="endpoint-item"><span class="method GET">GET</span><span class="path">/api/profiles/{name}</span></div>
        <div class="endpoint-item"><span class="method PUT">PUT</span><span class="path">/api/profiles/{name}</span></div>
        <div class="endpoint-item"><span class="method DELETE">DEL</span><span class="path">/api/profiles/{name}</span></div>
        <div class="endpoint-item"><span class="method POST">POST</span><span class="path">/api/profiles/{name}/launch</span></div>
        <div class="endpoint-item"><span class="method POST">POST</span><span class="path">/api/profiles/{name}/stop</span></div>
        <div class="endpoint-item"><span class="method GET">GET</span><span class="path">/api/sessions</span></div>
        <div class="endpoint-item"><span class="method POST">POST</span><span class="path">/api/fingerprint/generate</span></div>
        <div class="endpoint-item"><span class="method GET">GET</span><span class="path">/api/proxy</span></div>
        <div class="endpoint-item"><span class="method POST">POST</span><span class="path">/api/proxy/check</span></div>
        <div class="endpoint-item"><span class="method GET">GET</span><span class="path">/api/groups</span></div>
        <div class="endpoint-item"><span class="method POST">POST</span><span class="path">/api/groups</span></div>
      </div>
    </div>
  `;

}

async function startApiServer() {
  toast('Starting API server...', 'info');
  try {
    // The API server is already running (we're using it), this is just for UI
    apiServerRunning = true;
    toast('API server is running', 'success');
    renderAPI();
  } catch(e) { toast(e.message, 'error'); }
}

function stopApiServer() {
  apiServerRunning = false;
  toast('API server stopped', 'info');
  renderAPI();
}

async function resetApiKey() {
  showModal('Reset API Key', '<p>This will invalidate the current key. Continue?</p>',
    `<button class="btn btn-ghost" onclick="closeModal()">${_('common.cancel')}</button>
     <button class="btn btn-danger" onclick="confirmResetKey()">${_('api.reset_key')}</button>`);
}
async function confirmResetKey() {
  // In a real implementation, this would call the API to reset the key
  toast('API key reset (restart required)', 'info');
  closeModal();
}

function updateMcpConfig() {
  const config = {
    mcpServers: {
      fingerguard: {
        command: 'python',
        args: ['-m', 'src.api.mcp_server'],
        env: {
          FINGUARD_API_KEY: State.apiKey || '<your-api-key>',
          FINGUARD_API_URL: apiServerRunning ? `http://127.0.0.1:${apiServerPort}` : 'http://127.0.0.1:<port>',
        }
      }
    }
  };
  const el = document.getElementById('mcpConfig');
  if (el) el.textContent = JSON.stringify(config, null, 2);
}

function copyMcpConfig() {
  const text = document.getElementById('mcpConfig')?.textContent || '';
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard', 'success'));
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied', 'success'));
}

function setLocale(locale) {
  State.locale = locale;
  applyI18n();
  renderView();
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = _(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = _(el.dataset.i18nPh);
  });
}

// ========== Quick Launch (Ctrl+K) ==========
const quickLaunch = document.getElementById('quickLaunch');
const quickLaunchInput = document.getElementById('quickLaunchInput');
const quickLaunchResults = document.getElementById('quickLaunchResults');

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    quickLaunch.classList.add('show');
    quickLaunchInput.value = '';
    quickLaunchInput.focus();
    updateQuickLaunch('');
  }
  if (e.key === 'Escape') {
    quickLaunch.classList.remove('show');
    closeModal();
  }
});

quickLaunchInput.addEventListener('input', e => updateQuickLaunch(e.target.value));
quickLaunch.addEventListener('click', e => { if (e.target === quickLaunch) quickLaunch.classList.remove('show'); });

function updateQuickLaunch(query) {
  const q = query.toLowerCase();
  const items = [];
  // Commands
  const commands = [
    {title: 'New Profile', sub: 'Create a new browser profile', icon:'➕', action: () => { navTo('profiles'); showProfileModal(); }},
    {title: 'Test Fingerprint', sub: 'Open fingerprint test page', icon:'🧪', action: () => openFingerprintTest()},
    {title: 'Go to Dashboard', sub: 'View dashboard', icon:'📊', action: () => navTo('dashboard')},
    {title: 'Go to Profiles', sub: 'Manage profiles', icon:'👥', action: () => navTo('profiles')},
    {title: 'Go to Proxy Pool', sub: 'Manage proxies', icon:'🌐', action: () => navTo('proxies')},
    {title: 'Go to Groups', sub: 'Manage groups', icon:'📁', action: () => navTo('groups')},
    {title: 'Go to API & MCP', sub: 'API settings', icon:'🔌', action: () => navTo('api')},
    {title: 'Go to Settings', sub: 'Application settings', icon:'⚙️', action: () => navTo('settings')},
  ];
  commands.forEach(c => { if (!q || c.title.toLowerCase().includes(q)) items.push({...c, type:'command'}); });
  // Profiles
  State.profiles.forEach(p => {
    if (!q || p.name.toLowerCase().includes(q)) {
      items.push({title: p.name, sub: p.is_running?'Running • click to stop':'Stopped • click to launch', icon:'🌐', type:'profile', action: () => {
        navTo('profiles');
        if (p.is_running) stopProfile(p.name); else launchProfile(p.name);
      }});
    }
  });
  quickLaunchResults.innerHTML = items.slice(0, 8).map((item, i) => `
    <div class="quick-launch-item ${i===0?'selected':''}" onclick="quickLaunch.classList.remove('show'); (${item.action.toString()})()">
      <div class="ql-icon">${item.icon}</div>
      <div class="ql-info">
        <div class="ql-title">${item.title}</div>
        <div class="ql-sub">${item.sub}</div>
      </div>
    </div>
  `).join('') || '<div style="padding:20px;text-align:center;color:var(--text-muted)">No results</div>';
}

// ========== Fingerprint Test ==========
function openFingerprintTest() {
  // Open the test page in the default browser
  const testUrl = `${State.baseUrl}/test`;
  window.open(testUrl, '_blank');
}

// ========== Helpers ==========
function navTo(view) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-view="${view}"]`)?.classList.add('active');
  State.currentView = view;
  renderView();
}

// ========== Init ==========
// Get API key and base URL from the launcher (injected by pywebview)
// These are set via URL params when pywebview loads this page
async function init() {
  const params = new URLSearchParams(window.location.search);
  State.apiKey = params.get('key') || localStorage.getItem('fg_api_key') || '';
  const port = params.get('port') || localStorage.getItem('fg_port') || '0';
  State.baseUrl = `http://127.0.0.1:${port}`;
  apiServerPort = port;
  apiServerRunning = true;

  if (State.apiKey) {
    localStorage.setItem('fg_api_key', State.apiKey);
    localStorage.setItem('fg_port', port);
  }

  // Load locale
  State.locale = localStorage.getItem('fg_locale') || 'zh';
  applyI18n();

  // New profile button
  document.getElementById('newProfileBtn').addEventListener('click', () => showProfileModal());

  // Quick search
  document.getElementById('quickSearch').addEventListener('focus', () => {
    quickLaunch.classList.add('show');
    quickLaunchInput.focus();
  });

  renderView();
}

init();
</script>
