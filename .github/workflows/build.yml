name: Build and Test FingerGuard Browser

on:
  push:
    branches: [ "main", "commercial-fingerprint-browser-upgrade" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest responses setuptools
    - name: Test with pytest
      run: |
        python -m pytest tests/

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller setuptools
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed main.py --name FingerGuardBrowser-${{ runner.os }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FingerGuardBrowser-${{ runner.os }}
        path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release_assets/FingerGuardBrowser-Linux/FingerGuardBrowser-Linux
          release_assets/FingerGuardBrowser-Windows/FingerGuardBrowser-Windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
