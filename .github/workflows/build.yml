name: Build and Test FingerGuard Browser

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest responses setuptools

      - name: Test with pytest
        run: python -m pytest tests/ -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller setuptools

      - name: Build with PyInstaller
        run: python -m PyInstaller FingerGuardBrowser.spec --noconfirm --clean

      - name: Package portable release
        shell: pwsh
        run: |
          $src = "dist\FingerGuardBrowser"
          $dst = "dist\FingerGuardBrowser-Windows"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Rename-Item $src $dst
          '@echo off' | Out-File -FilePath "$dst\FingerGuardBrowser-quiet.bat" -Encoding ASCII
          'start "" "%~dp0FingerGuardBrowser.exe"' | Out-File -FilePath "$dst\FingerGuardBrowser-quiet.bat" -Append -Encoding ASCII
          Compress-Archive -Path $dst -DestinationPath "dist\FingerGuardBrowser-Windows.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FingerGuardBrowser-Windows
          path: dist/FingerGuardBrowser-Windows.zip

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*.zip
          generate_release_notes: true
